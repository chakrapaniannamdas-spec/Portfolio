<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ELM Architecture</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      max-width: 1100px;
      width: 100%;
      padding: 2rem;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .node {
      background: #121212;
      border: 1px solid #2a2a2a;
      border-left: 4px solid #f59e0b;
      padding: 1rem 1.25rem;
      border-radius: 0.5rem;
      width: 200px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .node:hover {
      border-color: #f59e0b;
      transform: translateX(5px);
      background: #1c1c1c;
    }
    .node-title { font-weight: 600; font-size: 0.9rem; color: #f5f5f5; margin-bottom: 0.25rem; }
    .node-sub { font-size: 0.75rem; color: #a3a3a3; }
    
    .center-node {
      background: linear-gradient(135deg, #1c1c1c, #121212);
      border: 2px solid #f59e0b;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.15);
      min-width: 220px;
    }
    .center-title { font-weight: 800; font-size: 1.25rem; color: #f59e0b; margin-bottom: 0.5rem; }
    
    .output-node {
      background: #121212;
      border: 1px solid #2a2a2a;
      border-left: 4px solid #10b981;
      padding: 1.5rem;
      border-radius: 0.5rem;
      width: 220px;
      text-align: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
    }
    .output-title { font-weight: 700; font-size: 1.1rem; color: #10b981; margin-bottom: 0.5rem; }
    
    .connector {
      width: 60px;
      height: 2px;
      background: #3f3f46;
      position: relative;
    }
    .connector::after {
      content: '';
      position: absolute;
      right: -2px;
      top: -4px;
      border-left: 8px solid #3f3f46;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Inputs -->
    <div class="col">
      <div class="node">
        <div class="node-title">Systems Engineering</div>
        <div class="node-sub">Requirements & SysML</div>
      </div>
      <div class="node">
        <div class="node-title">Quality & Production</div>
        <div class="node-sub">Validation & Assembly</div>
      </div>
      <div class="node">
        <div class="node-title">Security & OBD</div>
        <div class="node-sub">Diagnostics & Safety</div>
      </div>
      <div class="node">
        <div class="node-title">Global Suppliers</div>
        <div class="node-sub">USA · Europe · India · MENA</div>
      </div>
    </div>
    
    <div class="connector"></div>
    
    <!-- Center Platform -->
    <div class="center-node">
      <div class="center-title">ELM Platform</div>
      <div class="node-sub" style="color: #d4d4d4; line-height: 1.4;">Engineering Life Cycle<br>Management Toolchain</div>
    </div>
    
    <div class="connector"></div>
    
    <!-- Output -->
    <div class="output-node">
      <div class="output-title">Vehicle Projects</div>
      <div class="node-sub">Millions of Requirements</div>
    </div>
  </div>
</body>
</html>
